<div class="table-wrap">
<table class="data-table">
  <thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">IP</th></tr></thead>
  <tbody>
  {% for e in events %}
    <tr>
      <td>{{ e.created_at|date:"Y-m-d H:i" }}</td>
      <td>{{ e.actor_email|default:"(anonymous)" }}</td>
      <td><code>{{ e.action }}</code></td>
      <td>{{ e.target_label }}{% if e.details.reason %}<br><small>{{ e.details.reason }}</small>{% endif %}</td>
      <td>{{ e.ip|default:"" }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5">Nothing yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
